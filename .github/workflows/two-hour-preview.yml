name: Two-hour LinkedIn preview
on:
  schedule:
    # UTC 05,07,09,11,13,15 = Baku 09,11,13,15,17,19.
    - cron: '0 5,7,9,11,13,15 * * *'
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger authorized EdgeOne preview
        env:
          EDGEONE_ENDPOINT: ${{ secrets.EDGEONE_ENDPOINT }}
          EDGEONE_CRON_SECRET: ${{ secrets.EDGEONE_CRON_SECRET }}
        run: |
          test -n "$EDGEONE_ENDPOINT"
          test -n "$EDGEONE_CRON_SECRET"
          curl --fail --silent --show-error --max-time 30 -H "X-Agent-Cron-Secret: $EDGEONE_CRON_SECRET" "$EDGEONE_ENDPOINT"
